# Daily Blog Post Generator
name: Daily Blog Post

on:
  schedule:
    # Runs every day at 06:00 UTC (09:00 Latvia time)
    - cron: "0 6 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      day:
        description: "Specific day number (1-365). Leave empty for auto."
        required: false
        type: string
      no_ai:
        description: "Skip AI and use fallback content?"
        required: false
        type: boolean
        default: false

# Ensure only one instance runs at a time
concurrency:
  group: daily-blog-post
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for proper commit tracking
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate blog post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python scripts/generate_post.py --day ${{ github.event.inputs.day }}
          elif [ "${{ github.event.inputs.no_ai }}" = "true" ]; then
            python scripts/generate_post.py --no-ai
          else
            python scripts/generate_post.py
          fi

      - name: Commit and push changes
        run: |
          git config user.name "LatSEO Bot"
          git config user.email "bot@latseo.com"
          
          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git add -A
          
          # Get current day from progress file (handle first-run case)
          if [ -f scripts/.blog-progress.json ]; then
            DAY=$(python -c "import json; d=json.load(open('scripts/.blog-progress.json')); print(d.get('lastPublishedDay', 1))")
          else
            DAY="1"
          fi
          
          git commit -m "📝 Auto-publish blog post — Day $DAY/365 [skip ci]"
          git push origin main
