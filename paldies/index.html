  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F1501'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='17' fill='%23F5F5F0'%3ELS%3C/text%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">

  <style>
    /* ============================================================
       Thank You Page — Minimal, fast, conversion-proof
       ============================================================ */
    .ty-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--clr-dark);
      color: var(--clr-text-inverse);
      padding: var(--sp-xl);
      text-align: center;
    }

    .ty-card {
      max-width: 540px;
      animation: tyFadeIn 0.5s ease both;
    }

    .ty-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(93, 134, 108, 0.15);
      color: var(--clr-accent-text);
      margin-bottom: var(--sp-xl);
    }

    .ty-title {
      font-family: var(--ff-heading);
      font-weight: var(--fw-light);
      font-size: clamp(2rem, 5vw, var(--fs-3xl));
      line-height: var(--lh-tight);
      margin-bottom: var(--sp-sm);
      color: var(--clr-text-inverse);
    }

    .ty-name {
      color: var(--clr-accent-text);
      font-weight: var(--fw-semibold);
    }

    .ty-sub {
      font-size: var(--fs-md);
      color: var(--clr-accent-soft);
      line-height: var(--lh-relaxed);
      margin-bottom: var(--sp-xl);
    }

    .ty-steps {
      display: flex;
      flex-direction: column;
      gap: var(--sp-sm);
      text-align: left;
      background: rgba(245, 245, 240, 0.03);
      border: 1px solid rgba(245, 245, 240, 0.08);
      padding: var(--sp-lg);
      margin-bottom: var(--sp-xl);
    }

    .ty-step {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-sm);
      font-size: var(--fs-sm);
      color: var(--clr-accent-soft);
      line-height: var(--lh-relaxed);
    }

    .ty-step-icon {
      flex-shrink: 0;
      color: var(--clr-accent-text);
      margin-top: 1px;
    }

    .ty-step strong {
      color: var(--clr-text-inverse);
      font-weight: var(--fw-medium);
    }

    .ty-back {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2xs);
      color: var(--clr-text-muted);
      font-size: var(--fs-sm);
      transition: color var(--transition-fast);
      text-decoration: none;
    }

    .ty-back:hover {
      color: var(--clr-accent-text);
    }

    @keyframes tyFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ty-card { animation: none; }
    }
  </style>
</head>
<body>

  <div class="ty-page">
    <div class="ty-card">

      <!-- Success Icon -->
      <div class="ty-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <!-- Personalized Greeting -->
      <h1 class="ty-title">
        Paldies, <span class="ty-name" id="ty-name">…</span>!
      </h1>

      <p class="ty-sub">
        Tavs pieteikums bezmaksas SEO auditam ir saņemts.
        <strong>Mēs sazināsimies 24 stundu laikā.</strong>
      </p>

      <!-- What Happens Next -->
      <div class="ty-steps">
        <div class="ty-step">
          <svg class="ty-step-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span><strong>Šodien:</strong> Mēs saņēmām tavu pieteikumu un sākam analīzi</span>
        </div>
        <div class="ty-step">
          <svg class="ty-step-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span><strong>24h laikā:</strong> Saņemsi personalizētu video auditu savā e-pastā</span>
        </div>
        <div class="ty-step">
          <svg class="ty-step-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span><strong>Pēc tam:</strong> Bezmaksas online konsultācija, lai pārrunātu nākamos soļus</span>
        </div>
      </div>

      <!-- Back Link -->
      <a href="../" class="ty-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Atpakaļ uz latseo.com
      </a>

    </div>
  </div>

  <!-- Personalize name from URL -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var name = params.get('name');
      var el = document.getElementById('ty-name');
      if (name && el) {
        // Sanitize: only allow letters, spaces, and Latvian diacritics
        var safe = name.replace(/[^a-zA-ZĀāČčĒēĢģĪīĶķĻļŅņŌōŖŗŠšŪūŽž\s\-']/g, '').trim();
        if (safe) {
          el.textContent = safe;
        }
      }
    })();
  </script>

</body>
</html>
